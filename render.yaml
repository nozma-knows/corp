# Apply through Render Blueprints. The disk requires a paid instance; confirm
# the provider's current price in your account before provisioning.
services:
  - type: web
    name: corp-company-staging
    runtime: docker
    repo: https://github.com/nozma-knows/corp
    branch: codex/company-inspector-staging
    plan: starter
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /health/ready
    disk:
      name: company-state
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: CORP_ENV
        value: staging
      - key: CORP_DB_PATH
        value: /data/company.sqlite3
      - key: CORP_OPERATOR_PASSWORD_HASH
        sync: false
      - key: CORP_SESSION_SECRET
        generateValue: true
