[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "corp-company-lab"
version = "0.1.0"
description = "A local operating core for an agent-run digital company"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["corp*"]

[tool.setuptools.package-data]
corp = ["migrations/*.sql", "static/*"]
